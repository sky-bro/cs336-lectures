[project]
name = "lectures"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edtrace>=0.1.12",
    "einops>=0.8.2",
    "mmh3>=5.2.1",
    "tiktoken>=0.12.0",
    "torch>=2.11.0,<2.12",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.11.0,<2.12",
]
cu130 = [
    "torch>=2.11.0,<2.12",
]
remote = [
    "modal>=1.4.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
